services:
  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      DATABASE_URL: mysql+pymysql://campus_user:campus_dev_password@db:3306/campus_marketplace

  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: campus_marketplace
      MYSQL_USER: campus_user
      MYSQL_PASSWORD: campus_dev_password
      MYSQL_ROOT_PASSWORD: root_dev_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: